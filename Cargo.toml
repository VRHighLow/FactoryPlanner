[workspace]
members = [".", "relay"]
resolver = "2"

[package]
name = "factory_planner"
version = "0.2.5"
edition = "2021"
description = "Factory planner — dual-lane conveyors, power poles, online multiplayer."
license = "MIT"
repository = "https://github.com/VRHighLow/FactoryPlanner"

[dependencies]
macroquad = "0.4"
matchbox_socket = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
