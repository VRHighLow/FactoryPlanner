name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: factory_planner-linux-x86_64.zip
            pkg_name: FactoryPlanner
            bin_name: factory_planner
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: factory_planner-windows-x86_64.zip
            pkg_name: FactoryPlanner
            bin_name: factory_planner.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: factory_planner-macos-aarch64.zip
            pkg_name: FactoryPlanner
            bin_name: factory_planner
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: factory_planner-macos-x86_64.zip
            pkg_name: FactoryPlanner
            bin_name: factory_planner

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --bin factory_planner --target ${{ matrix.target }}

      # Steam-style package: binary + runtime assets only (never source).
      - name: Package game folder
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/factory_planner"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="${BIN}.exe"
          fi
          PKG="dist/${{ matrix.pkg_name }}"
          rm -rf dist
          mkdir -p "$PKG"
          cp "$BIN" "$PKG/${{ matrix.bin_name }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$PKG/${{ matrix.bin_name }}"
          fi
          # Runtime data only — art, icons, era packs. No src/, no docs/, no .git.
          mkdir -p "$PKG/assets"
          for dir in belts buildings data environment icons items ui; do
            if [[ -d "assets/$dir" ]]; then
              cp -R "assets/$dir" "$PKG/assets/"
            fi
          done
          # Drop empty keepers from the player-facing package.
          find "$PKG/assets" -name '.gitkeep' -delete 2>/dev/null || true
          python3 - <<'PY'
          import pathlib, shutil
          artifact = pathlib.Path("${{ matrix.artifact }}")
          pkg = pathlib.Path("dist") / "${{ matrix.pkg_name }}"
          if artifact.exists():
              artifact.unlink()
          shutil.make_archive(artifact.with_suffix("").as_posix(), "zip", pkg.parent, pkg.name)
          print(f"packed {artifact} ({artifact.stat().st_size} bytes)")
          PY
          ls -la "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # Upload as each platform finishes so the Releases page appears early.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}
          # Keep an existing titled release (gh release edit); don't clobber notes.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
